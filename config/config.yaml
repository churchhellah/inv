# Конфигурация агента. Это единственный источник правды по торговым лимитам —
# редактирует и коммитит человек. Агент отказывается стартовать при некорректных значениях.

# sandbox — виртуальный счёт в песочнице T-Invest API (без реальных денег).
# production — реальный брокерский счёт. Требует ТАКЖЕ production_ack: true ниже.
mode: production

# Главный рубильник. false — агент анализирует рынок и пишет решения в журнал,
# но НИКОГДА не отправляет заявки на биржу.
trading_enabled: true

# true — заявки не отправляются даже при trading_enabled: true (только расчёт и журнал).
# Используется для обкатки логики перед реальными деньгами.
dry_run: false

# Явное подтверждение человека на торговлю боевыми деньгами.
# Обязано быть true ОДНОВРЕМЕННО с mode: production, иначе агент откажется стартовать.
production_ack: true

# Список тикеров (MOEX), которыми агенту разрешено торговать. Ничего вне списка не покупается
# и не продаётся, даже если стратегия это предложит.
watchlist:
  - SBER
  - GAZP
  - LKOH
  - GMKN
  - YDEX
  - MGNT
  - TATN
  - ROSN
  - AFKS

limits:
  # Максимальная сумма одной заявки, руб.
  max_order_value_rub: 1000
  # Суммарный оборот на покупку/продажу за календарный день, руб.
  max_daily_buy_turnover_rub: 5000
  max_daily_sell_turnover_rub: 5000
  # Максимальная доля одной позиции в портфеле после сделки.
  max_single_stock_exposure_pct: 0.25
  # Минимальный остаток кэша, который агент обязан оставлять на счёте, руб.
  min_cash_reserve_rub: 1000
  # Максимум заявок за один проход анализа.
  max_orders_per_run: 3

schedule:
  # Раз в сколько минут запускать цикл анализа в режиме --daemon.
  interval_minutes: 60
  # Торговое окно MOEX (локальное время биржи).
  trading_start: "10:00"
  trading_end: "18:40"
  timezone: "Europe/Moscow"

indicators:
  candle_interval: hour   # hour | day
  lookback_days: 60
